<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта водных ресурсов Казахстана</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root { --bg-main: #141416; --bg-card: #222227; --text-main: #ffffff; --text-muted: #a0a0ab; --gradient-brand: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%); --input-bg: #1a1a1f; --border-color: #33333a; --status-green: #22c55e; --status-yellow: #eab308; --status-red: #ef4444; --status-blue: #3b82f6; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: var(--bg-main); color: var(--text-main); }
header { background: rgba(20, 20, 22, 0.95); position: sticky; top: 0; z-index: 1000; padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
header h1 { margin: 0; font-size: 24px; color: #3b82f6; }
.auth-btn { background: transparent; color: white; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; }
main { max-width: 1200px; margin: auto; padding: 20px; }
#map { height: 500px; border-radius: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); background: #222227; z-index: 1; }
.leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
.controls-panel { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
#search { flex-grow: 1; padding: 14px 20px; border-radius: 50px; background: var(--input-bg); color: white; border: 1px solid var(--border-color); }
.filter-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 50px; cursor: pointer; }
.filter-btn.active { background: white; color: black; }
#list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
.card { background: var(--bg-card); padding: 24px; border-radius: 20px; border: 1px solid var(--border-color); }
.badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; color: #fff; }
.bg-green { background: var(--status-green); } .bg-yellow { background: var(--status-yellow); color: #000; } .bg-red { background: var(--status-red); } .bg-blue { background: var(--status-blue); }
.custom-marker { width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
.modal-content { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid var(--border-color); }
.modal-content input, .submit-btn, .cancel-btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: none; font-weight: bold;}
.modal-content input { background: var(--input-bg); color: white; border: 1px solid var(--border-color); }
.submit-btn { background: var(--status-blue); color: white; cursor: pointer; }
.cancel-btn { background: transparent; color: var(--text-muted); cursor: pointer; border: 1px solid var(--border-color);}
</style>
</head>
<body>
<header>
    <h1>Живая Вода РК</h1>
    <button class="auth-btn" id="headerAuthBtn">Войти в систему</button>
</header>
<main>
    <div id="map"></div>
    <div class="controls-panel">
        <input id="search" placeholder="Поиск по названию или региону...">
        <button class="filter-btn" id="addSpringBtn" style="background: #3b82f6; color: white; border: none;">+ Добавить родник</button>
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="green">Подходит</button>
        <button class="filter-btn" data-filter="yellow">Проверяется</button>
        <button class="filter-btn" data-filter="red">Не подходит</button>
        <button class="filter-btn" data-filter="blue">Проверено в ЛАБ</button>
    </div>
    <div id="list"></div>

    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top:0; text-align:center;">Добавить родник</h2>
            <form id="addSpringForm">
                <input type="text" name="m_name" placeholder="Название (например, Ак-Булак)" required>
                <input type="text" name="m_region" placeholder="Регион (Алматинская обл.)" required>
                <input type="text" name="m_type" placeholder="Тип (Горный источник)" required>
                <input type="number" name="m_lat" step="0.000001" placeholder="Широта (43.2389)" required>
                <input type="number" name="m_lng" step="0.000001" placeholder="Долгота (76.8897)" required>
                <input type="text" name="m_researcher" placeholder="Ваше Имя" required>
                <button type="submit" class="submit-btn">Добавить на карту</button>
                <button type="button" id="closeModalBtn" class="cancel-btn">Отмена</button>
            </form>
        </div>
    </div>
</main>

<script>
const map = L.map('map').setView([48, 67], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markersLayer = L.layerGroup().addTo(map);

let springs = [];
let currentFilter = 'all';
let searchQuery = '';

const getMarkerIcon = (color) => L.divIcon({ className: 'custom-icon', html: `<div class="custom-marker" style="background-color: var(--status-${color});"></div>`, iconSize: [24,24], iconAnchor: [12,12] });

function renderAll() {
    markersLayer.clearLayers();
    let filtered = springs.filter(s => 
        (s.name.toLowerCase().includes(searchQuery) || s.region.toLowerCase().includes(searchQuery)) &&
        (currentFilter === 'all' || s.status === currentFilter)
    );

    filtered.forEach(s => {
        L.marker([s.lat, s.lng], { icon: getMarkerIcon(s.status) })
         .bindPopup(`<b>${s.name}</b><br>${s.region}`)
         .addTo(markersLayer);
    });

    document.getElementById('list').innerHTML = filtered.map(s => `
        <div class="card">
            <h3 style="margin:0">${s.name} <span class="badge bg-${s.status}" style="float:right">${s.status_text || 'Проверка'}</span></h3>
            <p style="color:var(--text-muted); font-size:14px;">${s.type} • ${s.region}</p>
            <p style="font-size:14px;"><b>Исследователь:</b> ${s.researcher}</p>
        </div>
    `).join('');
}

let supabase;
try {
    const supabaseUrl = 'https://ruufnctrimvyiakmohdb.supabase.co';
    const supabaseKey = 'sb_publishable_OKaW99uT-sCy51HvDymzzw_agJ02m_7';
    if (window.supabase) {
        supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    }
} catch(e) {
    console.error("Ошибка инициализации БД", e);
}

async function loadData() {
    if (!supabase) return;
    try {
        const { data, error } = await supabase.from('springs').select('*').order('id', { ascending: true });
        if (data) springs = data;
    } catch (err) { console.error(err); }
    renderAll();
}

document.getElementById('search').addEventListener('input', e => { searchQuery = e.target.value.toLowerCase(); renderAll(); });

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        if (e.target.id === 'addSpringBtn') return;
        document.querySelectorAll('.filter-btn:not(#addSpringBtn)').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderAll();
    });
});

const modal = document.getElementById('addModal');
document.getElementById('addSpringBtn').addEventListener('click', async () => {
    if (!supabase) { alert("Подключение к серверу..."); return; }
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { alert("Только авторизованные исследователи могут добавлять родники!"); return; }
    modal.style.display = 'flex';
});
document.getElementById('closeModalBtn').addEventListener('click', () => modal.style.display = 'none');

document.getElementById('addSpringForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!supabase) return;
    
    const submitBtn = e.target.querySelector('.submit-btn');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = 'Отправка...';
    submitBtn.disabled = true;

    const formData = new FormData(e.target);
    const newSpring = {
        name: formData.get('m_name'), region: formData.get('m_region'), type: formData.get('m_type'),
        lat: parseFloat(formData.get('m_lat')), lng: parseFloat(formData.get('m_lng')),
        status: "yellow", status_text: "Данные проверяются", researcher: formData.get('m_researcher'), date: new Date().toLocaleDateString('ru-RU')
    };

    const { error } = await supabase.from('springs').insert([newSpring]);
    
    submitBtn.textContent = originalText;
    submitBtn.disabled = false;

    if (error) {
        alert("Ошибка: " + error.message);
    } else { 
        alert("Успешно добавлено!"); 
        loadData(); 
        modal.style.display = 'none'; 
        e.target.reset(); 
    }
});

const headerBtn = document.getElementById('headerAuthBtn');
if (supabase) {
    supabase.auth.onAuthStateChange((event, session) => {
        headerBtn.textContent = session ? `👤 ${session.user.email.split('@')[0]}` : 'Войти в систему';
    });

    headerBtn.addEventListener('click', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) { 
            if(confirm("Выйти из аккаунта?")) supabase.auth.signOut(); 
        } else {
            const email = prompt("Введите ваш Email для входа (Вам придет письмо со ссылкой):");
            if (email) {
                const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
                if (error) {
                    alert('Ошибка отправки: ' + error.message);
                } else {
                    alert("Ссылка отправлена! Проверьте почту.");
                }
            }
        }
    });
}

loadData();
</script>
</body>
</html>
